    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <title>Registration</title>
    </head>
    <body>
        <div class="center">
           <div class="tabs">
                <span class="login-text">Login</span>
                <span class="divider1">|</span>
                <span class="register-text">Register</span>
            </div>
            
            <p class="subtitle">
            Enter your email and password to register.
            </p>

            <form class="form">
                <label>
                    <input class="input" type="text" placeholder="Username">
                </label>
                <label>
                    <input class="input" type="email" placeholder="Enter your email address">
                </label>
                <label>
                    <input class="input" type="password" placeholder="Password">
                </label>
                <label>
                    <input class="input" type="password" placeholder="Confirm Password">
                </label>
                </form>
            
            <div>
                <button class="button-register">Register</button>
            </div>

            <div class="divider2">
                <span>Or register with</span>
            </div>

            <div class="social">
                <form>
                    <button class="social-btn" type="button">
                        <img class="social-icon" src="img/google 1.svg" alt="Google">
                        <span class="social-text">Continue with Google</span>
                    </button>

                    <button class="social-btn" type="button">
                        <img class="social-icon" src="img/facebook 1.svg" alt="Facebook">
                        <span class="social-text">Continue with Facebook</span>
                    </button>
                </form>
                
            </div>

        <div class="center-bottom-line">
        <!-- весь контент -->
            <div class="bottom-line"></div>
        </div>
        </div>
    </body>
    </html>
